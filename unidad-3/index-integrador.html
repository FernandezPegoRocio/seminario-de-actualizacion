<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Seminario - Guía de Ejercicios</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #menu { margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="menu">
        <label for="selector">Seleccionar Ejercicio: </label>
        <select id="selector">
            <option value="">-- Elija una opción --</option>
            <option value="ejercicio-6.js"  data-fn="mainEj6">Ejercicio 6</option>
            <option value="ejercicio-12.js" data-fn="mainEj12">Ejercicio 12</option>
            <option value="ejercicio-19.js" data-fn="mainEj19">Ejercicio 19</option>
        </select>
    </div>

    <div id="app"></div>

    <script src="MVCCanvas.js"></script>

    <script>
        document.getElementById('selector').addEventListener('change', function() {
            let archivo    = this.value;
            let nombreFn   = this.options[this.selectedIndex].dataset.fn;
            let contenedor = document.getElementById('app');

            while (contenedor.firstChild)
            {
                contenedor.removeChild(contenedor.firstChild);
            }

            if (archivo)
            {
                if (typeof window[nombreFn] === 'function')
                {
                    window[nombreFn]();
                    return;
                }

                let script = document.createElement('script');
                script.src = archivo;

                script.onload = function() {
                    window[nombreFn]();
                };

                document.body.appendChild(script);
            }
        });
    </script>

</body>
</html>
